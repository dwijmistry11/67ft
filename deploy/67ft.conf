# /etc/67ft.conf — read by the systemd unit. Every name here is an environment
# variable the binary already understands; `67ft --help` lists them all.
#
# Edit and `sudo systemctl restart 67ft` to apply. Re-deploying does not
# overwrite this file once it exists.

# Pi-hole's admin interface owns port 80, and on v6 port 443 as well.
PORT=8080
HOST=0.0.0.0

# Sized for a 4GB board (Compute Module 5, Pi 4/5) sharing with Pi-hole.
#
# These two multiply: the worst case that matters is MAX_CONCURRENT whole
# response bodies buffered at once, so this ceiling is 400MB. That is the real
# memory bound on a Raspberry Pi, because the MemoryMax in the unit is ignored
# unless the memory cgroup controller has been turned on at boot.
#
# On a 1GB board — a Pi 3B, a Zero 2 — use 4 / 10 / 16 instead.
MAX_CONCURRENT=16
MAX_BODY_MB=25
CACHE_MB=128

# Articles do not change. A longer TTL is the difference between a re-read
# being instant and fetching the whole page again.
CACHE_TTL=1800
TIMEOUT=20
