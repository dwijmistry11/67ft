# /etc/67ft.conf — read by the systemd unit. Every name here is an environment
# variable the binary already understands; `67ft --help` lists them all.
#
# Edit and `sudo systemctl restart 67ft` to apply. Re-deploying does not
# overwrite this file once it exists.

# Pi-hole's admin interface owns port 80, and on v6 port 443 as well.
PORT=8080
HOST=0.0.0.0

# Sized for a Pi 3B sharing 1GB with Pi-hole. The worst case that matters is
# MAX_CONCURRENT whole response bodies buffered at once, so these two multiply:
# 4 x 10MB, plus the cache, is the memory ceiling the unit is written around.
MAX_CONCURRENT=4
MAX_BODY_MB=10
CACHE_MB=16

# Articles do not change. A longer TTL is the difference between a Pi 3B
# feeling instant on a re-read and re-fetching the page every time.
CACHE_TTL=1800
TIMEOUT=20
